name: Lead Qualifier — Daily Run

on:
  schedule:
    - cron: "0 22 * * *"   # 6pm ET during EDT (UTC-4, roughly Mar-Nov)
    - cron: "0 23 * * *"   # 6pm ET during EST (UTC-5, roughly Nov-Mar)
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  run-leadgen:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if not actually 6pm ET (avoids double-run across DST cron entries)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour=$(TZ="America/New_York" date +%H)
            if [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout repo
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r leadgen-agent/requirements.txt

      - name: Install Doppler CLI
        if: steps.check.outputs.run == 'true'
        uses: dopplerhq/cli-action@v3

      - name: Run lead qualifier
        if: steps.check.outputs.run == 'true'
        working-directory: leadgen-agent
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # Pulls ANTHROPIC_API_KEY, PLACES_API_KEY, DASHBOARD_URL, and
        # DASHBOARD_PASSWORD live from the digigrowth/prd Doppler config —
        # same command used to run this locally — instead of duplicating
        # secrets into GitHub Actions one by one.
        run: doppler run -- python run.py
