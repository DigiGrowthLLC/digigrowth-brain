name: Lead Qualifier — Daily Run

on:
  # schedule:
  #   - cron: "0 11 * * 1-5"   # 6am ET, weekdays only — PAUSED
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  run-leadgen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install anthropic gspread google-auth requests beautifulsoup4 python-dotenv

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > leadgen-agent/credentials.json

      - name: Run lead qualifier
        working-directory: leadgen-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python run.py
